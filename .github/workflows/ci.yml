name: CI

on:
  push:
    branches: [ main, develop, ultron/mainline ]
  pull_request:
    branches: [ main, develop, ultron/mainline ]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Shared knobs so every Bazel job excludes the same local-only test classes.
# CUDA (`cuda`), on-device (`requires-gpu`), and heavyweight integration tests
# that need real assets (`local-only`) are runnable locally but never in
# GitHub-hosted CI. Keep this list in sync with .bazelrc and tnsr/CONTEXT.md.
env:
  CI_TEST_TAG_FILTERS: "-cuda,-requires-gpu,-local-only"
  CI_BUILD_TAG_FILTERS: "-cuda,-requires-gpu"

jobs:
  desensitize:
    name: Desensitize
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Scan repository for PII / machine-identifiable info
      run: scripts/desensitize.sh

    - name: Scan pull request commits for PII / machine-identifiable info
      if: github.event_name == 'pull_request'
      run: scripts/check-commit-scrub.sh --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

    - name: Scan pull request text for PII / machine-identifiable info
      if: github.event_name == 'pull_request'
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        tmp="$(mktemp)"
        {
          printf '%s\n\n' "${PR_TITLE}"
          printf '%s\n' "${PR_BODY}"
        } > "${tmp}"
        python3 tools/desensitize_check.py "${tmp}"

  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is intentionally omitted: the hermetic toolchains_llvm build
        # fails on the macOS runner (ld64.lld cannot find static libstdc++),
        # which is a runner/toolchain limitation rather than a source defect.
        # Linux is the supported CI platform; reintroduce macOS only with a
        # working toolchain configuration.
        os: [ubuntu-24.04]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          clang-18 \
          libc++-18-dev \
          libc++abi-18-dev \
          libstdc++-12-dev \
          libncurses6 \
          libtinfo6
        # Install the libtinfo.so.5 compat shim the hermetic LLVM toolchain
        # needs on Ubuntu 24.04, and export LD_LIBRARY_PATH for Bazel actions.
        bash .github/scripts/setup-libtinfo-shim.sh >> "$GITHUB_ENV"

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.8.1
      with:
        bazelisk-version: '1.x'

    - name: Cache Bazel
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/bazel
          ~/.cache/bazelisk
        key: ${{ runner.os }}-bazel-${{ hashFiles('**/*.bazel', '**/*.bzl', 'MODULE.bazel', 'MODULE.bazel.lock') }}
        restore-keys: |
          ${{ runner.os }}-bazel-

    - name: Build all targets
      run: |
        bazel build //... \
          --build_tag_filters="${CI_BUILD_TAG_FILTERS}" \
          --action_env=LD_LIBRARY_PATH

    - name: Build C++ targets with hardening (Linux)
      run: |
        bazel build --config=hardened \
          --action_env=LD_LIBRARY_PATH \
          //ferric_continuum/hello/... //ferric_continuum/foundation/...

    - name: Run all tests
      run: |
        bazel test //... \
          --test_tag_filters="${CI_TEST_TAG_FILTERS}" \
          --action_env=LD_LIBRARY_PATH \
          --test_output=errors

    - name: Generate test summary
      if: always()
      run: |
        echo "## Test Results" >> "$GITHUB_STEP_SUMMARY"
        bazel test //... \
          --test_tag_filters="${CI_TEST_TAG_FILTERS}" \
          --action_env=LD_LIBRARY_PATH \
          --test_summary=detailed 2>&1 | tail -20 >> "$GITHUB_STEP_SUMMARY" || true

  format-check:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install clang-format
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format-18

    - name: Install rustfmt (stable)
      run: |
        rustup toolchain install stable
        rustup component add rustfmt --toolchain stable

    - name: Check C++ formatting
      run: |
        find ferric_continuum \( -name "*.cc" -o -name "*.hh" \) -print0 \
          | xargs -0 clang-format-18 --dry-run --Werror

    - name: Check Rust formatting (stable rustfmt, no warnings)
      run: |
        # Using stable rustfmt to avoid unstable feature warnings in CI. Fail
        # the job on the first unformatted file rather than swallowing errors.
        fail=0
        while IFS= read -r -d '' file; do
          if ! rustfmt +stable --edition 2021 --check "$file"; then
            fail=1
          fi
        done < <(find ferric_continuum -name "*.rs" -not -path "*/target/*" -print0)
        exit "$fail"

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.8.1
      with:
        bazelisk-version: '1.x'

    - name: Install clippy
      run: rustup component add clippy

    - name: Run Rust clippy
      run: |
        find ferric_continuum -name "*.rs" -not -path "*/target/*" | while read file; do
          cargo clippy --manifest-path=/dev/null -- --check "$file" || true
        done

  formal:
    name: Formal (TLA+/TLC)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.8.1
      with:
        bazelisk-version: '1.x'

    - name: Cache Bazel
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/bazel
          ~/.cache/bazelisk
        key: ${{ runner.os }}-bazel-formal-${{ hashFiles('**/*.bazel', '**/*.bzl', 'MODULE.bazel', 'MODULE.bazel.lock') }}
        restore-keys: |
          ${{ runner.os }}-bazel-

    # The MeshPlan TLC check is tagged `local-only` (it fetches the pinned
    # tla2tools.jar over the network), so the default build-and-test job skips
    # it. Run it here with the hermetic verifier, which uses --config=formal
    # (pinned remotejdk_17 + @tla2tools//jar) and NEVER presents a SKIP as PASS.
    - name: Run distributed-training formal verifier
      run: |
        bash formal/tools/verify_formal_mesh_plan.sh

  coverage:
    name: Test Coverage
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          clang-18 \
          libc++-18-dev \
          libc++abi-18-dev \
          libstdc++-12-dev \
          libncurses6 \
          libtinfo6
        bash .github/scripts/setup-libtinfo-shim.sh >> "$GITHUB_ENV"

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.8.1
      with:
        bazelisk-version: '1.x'

    - name: Cache Bazel
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/bazel
          ~/.cache/bazelisk
        key: ${{ runner.os }}-bazel-coverage-${{ hashFiles('**/*.bazel', '**/*.bzl', 'MODULE.bazel', 'MODULE.bazel.lock') }}
        restore-keys: |
          ${{ runner.os }}-bazel-

    - name: Run tests with coverage
      run: |
        bazel coverage //... \
          --test_tag_filters="${CI_TEST_TAG_FILTERS}" \
          --action_env=LD_LIBRARY_PATH

    - name: Generate coverage report
      run: |
        echo "## Coverage Report" >> "$GITHUB_STEP_SUMMARY"
        echo "Test coverage metrics will be available soon." >> "$GITHUB_STEP_SUMMARY"
