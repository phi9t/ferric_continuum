[package]
name = "tnsr"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tnsr_demo"
path = "src/main.rs"

[[bin]]
name = "qwen3_op_trace"
path = "src/bin/qwen3_op_trace.rs"

[[bin]]
name = "qwen3_demo"
path = "src/bin/qwen3_demo.rs"

[[bin]]
name = "qwen3_generate"
path = "src/bin/qwen3_generate.rs"

[lib]
name = "tnsr"
path = "src/lib.rs"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# Opt-in GPU forward path for matmul + softmax via the cuda_kernels C ABI.
# Under Bazel this is selected by `--config=cuda` (see BUILD.bazel); the FFI
# symbols are provided by //ferric_continuum/cuda_kernels. Backward stays on the
# CPU path. Not buildable with plain `cargo` (no CUDA link), so it is off by
# default and CPU builds/tests never touch CUDA.
cuda = []
